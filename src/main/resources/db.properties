# JDBC 驱动类名，MySQL 8 使用 com.mysql.cj.jdbc.Driver
driver=com.mysql.cj.jdbc.Driver

# 数据库连接地址：本实验使用现有 mybatisdemo1 数据库，不新建数据库和数据表
url=jdbc:mysql://localhost:3306/mybatisdemo1?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8

# 数据库用户名
username=root

# 数据库密码：按本机 MySQL 实际密码填写
password=
