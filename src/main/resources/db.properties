# JDBC 驱动类名（MySQL 8 使用 com.mysql.cj.jdbc.Driver）
driver=com.mysql.cj.jdbc.Driver
# 数据库连接地址：localhost=本机，3306=端口，MybatisDB=数据库名
# 参数：useSSL=false 关闭SSL；allowPublicKeyRetrieval=true 允许获取公钥；
#      serverTimezone 指定时区；characterEncoding 指定字符编码
url=jdbc:mysql://localhost:3306/MybatisDB?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
# 数据库用户名
username=root
# 数据库密码
password=123456
