# Log4j 日志配置
# 全局日志级别：DEBUG 会输出 SQL 语句、参数、结果等详细信息
log4j.rootLogger=DEBUG, console, file

# —— 输出到控制台（IDEA 控制台 / mvn test 输出）——
log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.Target=System.out
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=[%p] %d{yyyy-MM-dd HH:mm:ss,SSS} %c{1} - %m%n

# —— 输出到日志文件（mybatis.log，位于项目根目录）——
log4j.appender.file=org.apache.log4j.FileAppender
log4j.appender.file.File=mybatis.log
log4j.appender.file.Append=true
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=[%p] %d{yyyy-MM-dd HH:mm:ss,SSS} %c{1} - %m%n

# 只让 mapper 包输出 DEBUG（这里 rootLogger 已经是 DEBUG，本行可省略，仅作示例）
log4j.logger.com.demo.mapper=DEBUG
